# Agena desktop packaging (private beta). Unsigned/un-notarized: first launch
# on another Mac needs right-click → Open. Signing/notarization is D5 work.
appId: dev.kshgrk.agena
productName: Agena
electronVersion: 43.0.0
directories:
  output: release
extraMetadata:
  main: dist-electron/main.mjs
files:
  - dist/renderer/**
  - dist-electron/**
  - package.json
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  identity: null
  category: public.app-category.developer-tools
